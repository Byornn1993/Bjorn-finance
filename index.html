<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bjorn Finance</title><meta name="theme-color" content="#101418"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Finance"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=5"><link rel="icon" type="image/png" href="favicon.png?v=5"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#101418;color:#FBF6EE}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Huisstijl: Deep Black #101418, Slate Blue #2C3E50, Muted Gold #B08D57, Champagne #DCC9A6, Warm White #FBF6EE.
   Alle kleuren lopen via deze tokens; donker is de standaard, licht via de themaknop of het toestel. */
:root{
  --bg:#101418; --surface:#2C3E50; --surface-2:#243445; --input:#22313F; --line:rgba(220,201,166,.17); --line-2:rgba(220,201,166,.09);
  --fg:#FBF6EE; --muted:#CBB994; --champ:#DCC9A6; --accent:#B08D57; --accent-fg:#101418; --accent-soft:rgba(176,141,87,.18);
  --pos:#8DBF98; --neg:#E0907E; --warn:#D9AE63; --pos-soft:rgba(141,191,152,.15); --neg-soft:rgba(224,144,126,.15);
  --c1:#8FA9C2; --c2:#DCC9A6; --c3:#B08D57; --c4:#7C8FA3; --c5:#9DB59A; --c6:#D08A78;
  --shadow:0 1px 2px rgba(0,0,0,.22); --side:#101418; color-scheme:dark;
  --font-display:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: light){:root:not([data-theme]){
  --bg:#F6F1E8; --surface:#FFFDF9; --surface-2:#F3ECE0; --input:#FFFFFF; --line:#E4D9C6; --line-2:#EEE6D8;
  --fg:#101418; --muted:#6E6253; --champ:#B08D57; --accent:#8E6E3E; --accent-fg:#FBF6EE; --accent-soft:#F1E7D4;
  --pos:#4E7F5A; --neg:#A9503E; --warn:#A57524; --pos-soft:#E4EFE4; --neg-soft:#F6E2DC;
  --c1:#2C3E50; --c2:#C9AE7E; --c3:#B08D57; --c4:#7C8FA3; --c5:#7E9A7A; --c6:#B5654F;
  --shadow:0 1px 2px rgba(16,20,24,.05),0 4px 14px rgba(16,20,24,.04); --side:#FBF6EE; color-scheme:light }}
:root[data-theme="light"]{
  --bg:#F6F1E8; --surface:#FFFDF9; --surface-2:#F3ECE0; --input:#FFFFFF; --line:#E4D9C6; --line-2:#EEE6D8;
  --fg:#101418; --muted:#6E6253; --champ:#B08D57; --accent:#8E6E3E; --accent-fg:#FBF6EE; --accent-soft:#F1E7D4;
  --pos:#4E7F5A; --neg:#A9503E; --warn:#A57524; --pos-soft:#E4EFE4; --neg-soft:#F6E2DC;
  --c1:#2C3E50; --c2:#C9AE7E; --c3:#B08D57; --c4:#7C8FA3; --c5:#7E9A7A; --c6:#B5654F;
  --shadow:0 1px 2px rgba(16,20,24,.05),0 4px 14px rgba(16,20,24,.04); --side:#FBF6EE; color-scheme:light }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:27px;font-weight:700;letter-spacing:-.025em}
h2{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Shell */
.app{display:flex;min-height:100%}
.side{display:none}
.main{flex:1;min-width:0;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1320px;margin:0 auto;width:100%}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--side);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottom a,.bottom button.navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;font-size:11px;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer}
.bottom a[aria-current="page"]{color:var(--fg);font-weight:600}.bottom a[aria-current="page"] svg{color:var(--accent)}
.fab{width:56px;height:56px;border-radius:28px;border:0;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;margin:-22px auto 0;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent);cursor:pointer}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;width:240px;flex:none;background:var(--side);border-right:1px solid var(--line-2);padding:24px 14px}
  .bottom{display:none}
  .main{padding-block:28px 48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:38px;height:38px;border-radius:10px;flex:none;display:block;border:1px solid var(--line)}
.brand b{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:-.01em;display:block}
.side a{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.side a:hover{background:color-mix(in srgb,var(--champ) 7%,transparent);color:var(--fg)}
.side a[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}.side a[aria-current="page"] svg{color:var(--accent)}
.side .soon{margin-top:auto;padding:12px;border:1px dashed var(--line);border-radius:12px;font-size:12.5px;color:var(--muted)}
.side svg,.bottom svg{flex:none}

/* Header */
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.head .sub{color:var(--muted);font-size:14px;margin-top:2px}
.monthnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
.sel{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--input);padding:0 10px;min-width:0}
.btn{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn{transition:border-color .15s,background-color .15s,color .15s}.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--fg))}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.small{height:34px;padding:0 10px;font-size:13px;border-radius:10px}
.btn.ghost{border-color:transparent;background:transparent}
a{color:var(--accent)} a.btn{color:var(--fg);text-decoration:none} a.btn.primary{color:var(--accent-fg)}

/* Cards & grids */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{margin-bottom:2px}
.card .cap{font-size:13px;color:var(--muted);margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.025em;overflow-wrap:anywhere;color:var(--fg)}
@media (min-width:700px){.kpi .v{font-size:25px}}
.kpi .v.pos{color:var(--accent)} .kpi .v.neg{color:var(--neg)}
.kpi.hero{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface) 70%);border-color:color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:inset 0 2px 0 var(--accent)}.kpi.hero .v{color:var(--accent)}.kpi.hero .v.neg{color:var(--neg)}
.kpi.hero .label{color:var(--accent)}
.delta{font-size:12px;font-weight:600;display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:99px;width:max-content;max-width:100%}
.delta.up{background:var(--pos-soft);color:var(--pos)} .delta.down{background:var(--neg-soft);color:var(--neg)} .delta.flat{background:var(--surface-2);color:var(--muted)}

.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1000px){.grid2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grid3{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:700px) and (max-width:999px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Charts */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.legend span{display:inline-flex;align-items:center;gap:6px}
.donutwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.donutwrap svg{width:170px;flex:none}
.dl{flex:1;min-width:190px;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.dl div{display:grid;grid-template-columns:14px minmax(0,1fr) auto 44px;gap:8px;align-items:center}
.dl .pct{color:var(--muted);text-align:right}
.hbar{display:flex;flex-direction:column;gap:10px}
.hbar .row{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.hbar .top{display:flex;justify-content:space-between;gap:10px}
.hbar .top span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:6px;border-radius:99px;background:color-mix(in srgb,var(--champ) 12%,transparent);overflow:hidden}
.fill{height:100%;border-radius:99px}

/* Pots */
.pot{display:flex;flex-direction:column;gap:10px}
.pot .tophead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pot .name{display:flex;align-items:center;gap:10px;font-weight:600;font-family:var(--font-display)}
.pot .big{font-family:var(--font-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.pot .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:13px}
.pot .meta b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.ptrack{height:10px;border-radius:99px;background:color-mix(in srgb,var(--champ) 12%,transparent);overflow:hidden}
.actions{display:flex;flex-wrap:wrap;gap:8px}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px;min-height:32px;display:flex;align-items:center}
.minilist{display:flex;flex-direction:column;font-size:13.5px}
.minilist div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.minilist div span:first-child{min-width:0}

/* Transactions */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 220px;position:relative;min-width:0}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--input);padding:0 12px 0 38px}
.search svg{position:absolute;left:12px;top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tablebox{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface)}
table.tx{width:100%;border-collapse:collapse;font-size:14px;min-width:880px}
table.tx th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line)}
table.tx th button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
table.tx td{padding:4px 6px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tx tr:hover td{background:var(--surface-2)}
table.tx input,table.tx select{width:100%;height:34px;border:1px solid transparent;border-radius:8px;background:transparent;padding:0 6px}
table.tx input:hover,table.tx select:hover{border-color:var(--line)}
table.tx input:focus,table.tx select:focus{border-color:var(--accent);background:var(--surface)}
table.tx .amt input{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
table.tx tfoot td{font-weight:600;background:var(--surface-2);padding:10px 8px}
.amt-in{color:var(--pos)} .amt-out{color:var(--fg)}
.amtwrap{display:flex;align-items:center;gap:2px} .amtwrap b{font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;width:100%;cursor:pointer}
.li:last-child{border-bottom:0}
.li .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t span{font-size:12.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .a{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .a span{display:block;font-size:12px;color:var(--muted);font-weight:400}
.daysep{padding:8px 14px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.sumbar{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13.5px;color:var(--muted)}
.sumbar b{color:var(--fg);font-variant-numeric:tabular-nums}

/* Balance */
.btable{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 130px 40px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2)}
.brow input{height:38px;border:1px solid transparent;border-radius:8px;background:transparent;padding:0 8px;width:100%;min-width:0}
.brow input:hover{border-color:var(--line)} .brow input:focus{border-color:var(--accent);background:var(--surface)}
.brow input.val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bgroup{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 0 4px}
.btotal{display:flex;justify-content:space-between;padding:12px 0 2px;font-weight:700;font-family:var(--font-display)}
.equity{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.equity .big{font-family:var(--font-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.025em;color:var(--accent)}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px}
.check.ok{background:var(--pos-soft);color:var(--pos)} .check.bad{background:var(--neg-soft);color:var(--neg)}
.note{font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:12px 14px;max-width:72ch}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,10,12,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{border-radius:22px}}
.sheet .shead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg button{height:40px;border:0;border-radius:11px;background:transparent;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:700;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{height:46px;border:1px solid var(--line);border-radius:12px;background:var(--input);padding:0 12px;color:var(--fg);font-size:15px;width:100%;min-width:0}
.field textarea{height:72px;padding:10px 12px;resize:vertical}
.field input.amount{height:58px;font-family:var(--font-display);font-size:26px;font-weight:700}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.receipt{display:flex;gap:12px;align-items:center;border:1px dashed var(--line);border-radius:14px;padding:10px;flex-wrap:wrap}
.receipt img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.receipt .pdf{width:72px;height:72px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted)}
.err{color:var(--neg);font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;font-size:14px}
@media (min-width:900px){.toast{bottom:28px}}
table.yr{border-collapse:separate;border-spacing:0;font-size:13.5px;width:100%;min-width:1100px}
table.yr th,table.yr td{padding:7px 8px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.yr th{background:var(--surface-2);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;position:sticky;top:0}
table.yr th:first-child,table.yr td:first-child{position:sticky;left:0;background:var(--surface);text-align:left;z-index:1;max-width:230px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line-2)}
table.yr th:first-child{background:var(--surface-2);z-index:2}
table.yr tr.sec td{background:var(--surface-2);font-family:var(--font-display);font-weight:700;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);text-align:left}
table.yr tr.sec td:first-child{background:var(--surface-2)}
table.yr tr.tot td{font-weight:700;border-bottom:2px solid var(--line)}
table.yr tr.grand td{font-weight:700;font-family:var(--font-display);background:var(--accent-soft)}

<script>
(function(){
'use strict';
/* ---------- Vaste structuur (categorieën uit je Excel) ---------- */
const SAVE_CAT='Sparen / beleggen';
const GROUPS=[
  {id:'inkomen',name:'Inkomsten',kind:'inkomen',color:'--c3',cats:['Netto loon 1','Netto loon 2','Kindergeld / toelagen','Overige inkomsten']},
  {id:'vast',name:'Vaste lasten',kind:'uitgave',color:'--c1',cats:['Hypotheek','Extra lening','Boodschappen','Energie (gas/elektriciteit)','Water','Internet & TV & GSM','Belastingen','Zorgverzekering (BE&NL)','Auto verzekering','Woon en inboedelverzekering','Vervoer/brandstof','Onderhoud huis','Overige verzekeringen','Abonnementen (streaming, sport, etc.)','Goede doelen']},
  {id:'vrij',name:'Vrije tijd & dagelijks leven',kind:'uitgave',color:'--c5',cats:['Gezondheid & persoonlijke verzorging','Kleding','Uit eten & horeca','Vakantie','Cadeaus','Overig']},
  {id:'spaar',name:'Sparen / beleggen',kind:'uitgave',color:'--c3',cats:['Crypto','Aandelen Argenta','Pensioensparen',SAVE_CAT]}
];
const CAT_GROUP={};
const groupById=id=>GROUPS.find(g=>g.id===id);
// Indeling van het jaaroverzicht per groep; '' is een lege rij. Je eigen indeling (Jaaroverzicht > Indeling aanpassen)
// wordt bewaard als prognose/indeling (de database laat geen nieuwe soort toe).
const DEFAULT_LAYOUT=Object.fromEntries(GROUPS.map(g=>[g.id,g.cats.slice()]));
DEFAULT_LAYOUT.vast.splice(10,0,''); DEFAULT_LAYOUT.vast.splice(6,0,''); DEFAULT_LAYOUT.vast.splice(2,0,'');
// Vangnet-categorieën: onbekende transacties komen hierin terecht, dus niet te verwijderen of te hernoemen.
const FIXED_CATS=['Overig','Overige inkomsten',SAVE_CAT];
function applyLayout(){
  const d=S.prognose.find(x=>x.id==='indeling'), L=d&&d.groups?d.groups:DEFAULT_LAYOUT;
  for(const g of GROUPS){g.layout=(L[g.id]||DEFAULT_LAYOUT[g.id]).slice(); g.cats=g.layout.filter(Boolean)}
  for(const c of FIXED_CATS){const home=GROUPS.find(g=>DEFAULT_LAYOUT[g.id].includes(c)); if(!GROUPS.some(g=>g.cats.includes(c))){home.layout.push(c);home.cats.push(c)}}
  for(const k in CAT_GROUP)delete CAT_GROUP[k];
  GROUPS.forEach(g=>g.cats.forEach(c=>CAT_GROUP[c]=g));
}
const groupOf=c=>CAT_GROUP[c]||groupById('vrij');
// Elke categorie uit de groep Sparen / beleggen telt als sparen (niet als levenskosten).
const isSaveCat=c=>(CAT_GROUP[c]||{}).id==='spaar';
const MONTHS=['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
const MSHORT=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const TYPES={inkomen:'Inkomen',uitgave:'Uitgave',overboeking:'Overboeking'};

/* ---------- Toestand ---------- */
const S={tx:[],pots:[],balance:[],networth:[],prognose:[],loaded:{tx:false,pots:false,balance:false,networth:false,prognose:false}};
applyLayout();
let dbState='wachten';
const now=new Date();
const ui={view:'dashboard',y:now.getFullYear(),m:now.getMonth()+1,
  f:{q:'',year:String(now.getFullYear()),month:'all',type:'all',cat:'all'},sort:{k:'date',d:'desc'},
  confirm:null,potEdit:null,pendingRender:false};

/* ---------- Hulpfuncties ---------- */
const eur=new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR'});
const eur0=new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fmt=v=>eur.format(v||0), fmt0=v=>eur0.format(v||0);
const pct=v=>(isFinite(v)?(v*100).toFixed(1).replace('.',','):'0,0')+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2=v=>Math.round(v*100)/100;
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const monthKey=d=>d.slice(0,7);
function parseAmount(s){
  if(typeof s==='number')return s;
  s=String(s||'').replace(/[€\s]/g,'');
  if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  return parseFloat(s);
}
const amtStr=v=>(v==null||v==='')?'':String(round2(v)).replace('.',',');
function fdate(d){if(!d)return'';const [y,m,dd]=d.split('-');return dd+'/'+m+'/'+y}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- Rekenregels ----------
   inkomen       = transacties van type Inkomen
   sparen        = uitgaven in categorie Sparen / beleggen (incl. stortingen naar potjes)
   uit potje     = uitgaven die je uit een spaarpotje betaalde; zoals in Excel (rij Spaarpotjes)
                   tellen die zowel als inkomen als als uitgave (Vrije tijd & dagelijks leven)
   inkomen       = inkomen + uit potje
   levenskosten  = alle uitgaven − sparen
   vrije cashflow= inkomen − levenskosten
   eindsaldo     = inkomen − levenskosten − sparen
   overboekingen: rekening → potje telt als sparen (zoals een storting),
                  potje → rekening telt als inkomen uit potjes (rij Spaarpotjes),
                  potje → potje telt niet mee
   overdracht    = vanaf november 2026 telt het eindsaldo van de vorige maand automatisch
                  als inkomen (rij Over van vorige maand); ook een negatief eindsaldo */
function txIn(y,m){return S.tx.filter(t=>t.date&&+t.date.slice(0,4)===y&&(!m||+t.date.slice(5,7)===m))}
// Een lege potIn/potOut bij een overboeking is de rekening.
function moveKind(t){
  if(t.type!=='overboeking')return null;
  if(!t.potOut&&t.potIn)return 'storting';
  if(t.potOut&&!t.potIn)return 'opname';
  return null;
}
// Inkomsten en opnames uit een potje komen op je rekening binnen: die krijgen een groene +.
const isPlus=t=>t.type==='inkomen'||moveKind(t)==='opname';
// Vanaf deze maand neemt elke maand het eindsaldo van de vorige maand mee (oktober 2026 boekte dat nog met de hand).
const CARRY_FROM=2026*12+11, CARRY_ROW='Over van vorige maand';
function carryIn(y,m){if(y*12+m<CARRY_FROM)return 0;return m===1?stats(y-1,12).eindsaldo:stats(y,m-1).eindsaldo}
function stats(y,m){
  const L=txIn(y,m); const r={inkomen:0,uitgaven:0,sparen:0,uitPot:0,opname:0,count:L.length,groups:{},cats:{}};
  for(const t of L){const a=+t.amount||0;
    if(t.type==='inkomen'){r.inkomen+=a;continue}
    const mk=moveKind(t);
    if(mk==='opname'){r.opname+=a;continue}
    if(mk==='storting'){r.uitgaven+=a;r.sparen+=a;r.groups.spaar=(r.groups.spaar||0)+a;r.cats[SAVE_CAT]=(r.cats[SAVE_CAT]||0)+a;continue}
    if(t.type!=='uitgave')continue;
    r.uitgaven+=a;
    if(isSaveCat(t.category))r.sparen+=a; else if(t.potOut)r.uitPot+=a;
    const fromPot=!isSaveCat(t.category)&&t.potOut; const ck=fromPot?'Spaarpotjes':t.category;
    const g=fromPot?'vrij':groupOf(t.category).id; r.groups[g]=(r.groups[g]||0)+a; r.cats[ck]=(r.cats[ck]||0)+a;
  }
  r.carry=carryIn(y,m);
  r.inkomenLoon=r.inkomen; r.inkomen+=r.uitPot+r.opname+r.carry;
  r.levenskosten=r.uitgaven-r.sparen;
  r.cashflow=r.inkomen-r.levenskosten;
  r.eindsaldo=r.inkomen-r.levenskosten-r.sparen;
  const inkNieuw=r.inkomen-r.carry; // percentages zonder het overgedragen bedrag
  r.spaarPct=inkNieuw?r.sparen/inkNieuw:0;
  r.levPct=inkNieuw?r.levenskosten/inkNieuw:0;
  return r;
}
function potBalance(p){
  let b=+p.startBalance||0; const from=p.startDate||'0000';
  for(const t of S.tx){ if(!t.date||t.date<from)continue; const a=+t.amount||0;
    if(t.potIn===p.id)b+=a; if(t.potOut===p.id)b-=a; }
  return b;
}
function potTx(p){return S.tx.filter(t=>t.potIn===p.id||t.potOut===p.id).sort((a,b)=>b.date.localeCompare(a.date))}
// Bank- en spaarrekening rekent mee: potjes + eindsaldo van de huidige maand (zoals Saldo rekening op het dashboard).
function accountSaldo(){const d=new Date();return S.pots.reduce((a,p)=>a+potBalance(p),0)+stats(d.getFullYear(),d.getMonth()+1).eindsaldo}
// Een gekoppelde post (linkCat) telt elke uitgave in die categorie op na de stand van linkFrom, zodra haar datum er is.
function balValue(b){
  if(b.isAccount)return accountSaldo();
  let v=+b.value||0;
  if(b.linkCat){const today=todayStr();for(const t of S.tx)if(t.type==='uitgave'&&t.category===b.linkCat&&t.date>(b.linkFrom||'')&&t.date<=today)v+=+t.amount||0}
  return v;
}
function balTotals(items){let a=0,s=0;for(const i of items){const v=balValue(i);if(i.side==='schuld')s+=v;else a+=v}return{activa:a,schulden:s,netto:a-s}}
const potName=id=>(!id||id==='rekening')?'Rekening':(S.pots.find(p=>p.id===id)||{}).name||'Potje';
const potColor=p=>'var('+(p.color||'--c3')+')';

/* ---------- Opslag (Supabase) ---------- */
const SB_URL='https://xznredbjdxkneqggnlwx.supabase.co';
const SB_KEY='sb_publishable_bwZnqzg04BZTDgTumCxogw_4njJoLK8';
const BUCKET='bonnetjes';
const COLS=['tx','pots','balance','networth','prognose'];
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let session=null, authState='laden', loginUi={email:lsGet('bf-email')||'',mode:lsGet('bf-email')?'in':'nieuw',busy:false,err:''};
function sortCol(c){
  if(c==='pots')S.pots.sort((a,b)=>(a.order||0)-(b.order||0));
  if(c==='balance')S.balance.sort((a,b)=>(a.order||0)-(b.order||0));
  if(c==='networth')S.networth.sort((a,b)=>String(a.month).localeCompare(String(b.month)));
}
async function fetchAll(){
  const rows=[]; const step=1000;
  for(let from=0;;from+=step){
    const {data,error}=await sb.from('items').select('soort,id,gegevens').order('soort').order('id').range(from,from+step-1);
    if(error)throw error; rows.push(...data); if(data.length<step)break;
  }
  return rows;
}
let loading=null;
async function loadAll(quiet){
  if(!session)return; if(loading)return loading;
  loading=(async()=>{
    try{
      const rows=await fetchAll();
      for(const c of COLS)S[c]=[];
      for(const r of rows){ if(S[r.soort])S[r.soort].push(Object.assign({},r.gegevens,{id:r.id})) }

    }catch(e){ if(!quiet||dbState!=='ok')dbState='fout' }

}
const assets={
  async upload(file){
    const ext=(file.name&&file.name.includes('.'))?file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,''):(file.type==='application/pdf'?'pdf':'jpg');
    const path=session.user.id+'/'+newId()+'.'+(ext||'jpg');
    const type=file.type||'image/jpeg';
    const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:type,upsert:false});
    if(error){const m=String(error.message||'');throw {code:/size|large/i.test(m)?'too_large':/mime|type/i.test(m)?'unsupported_type':'fout'}}
    return {id:path,contentType:type};
  },
  async delete(id){ if(!isStoredReceipt({id}))return; await sb.storage.from(BUCKET).remove([id]) }
};
const isStoredReceipt=r=>!!(r&&r.id&&String(r.id).includes('/'));
const rcUrls={};
async function receiptUrl(r){
  if(!isStoredReceipt(r))return null;
  const c=rcUrls[r.id]; if(c&&c.until>Date.now())return c.url;
  const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(r.id,3600);
  if(error||!data)return null;
  rcUrls[r.id]={url:data.signedUrl,until:Date.now()+50*60*1000}; return data.signedUrl;
}
async function hydrateReceipts(root){

}

  if(error){toast(navigator.onLine===false?'Geen internet. Je wijziging is niet bewaard.':'Opslaan mislukt. Probeer het opnieuw.');return false}

async function readImportFile(file){

    const j=JSON.parse(await file.text());
    if(j.app!=='Bjorn Finance'||!j.gegevens)throw 0;

    imp.data=j;
  }catch(e){imp.err='Dit is geen exportbestand van Bjorn Finance. Kies het bestand dat begint met bjorn-finance-export.'}
  render();

async function runImport(){
  if(!imp.data||imp.busy)return; imp.busy=true; render();
  try{
    const uid=session.user.id, rows=[];
    for(const c of COLS)for(const d of (imp.data.gegevens[c]||[])){
      if(!d||!d.id)continue; const g=Object.assign({},d); delete g.id;
      if(g.receipt&&!isStoredReceipt(g.receipt))g.receipt=Object.assign({},g.receipt,{legacy:true});
      rows.push({user_id:uid,soort:c,id:String(d.id),gegevens:g});
    }
    const del=await sb.from('items').delete().eq('user_id',uid); if(del.error)throw del.error;
    for(let i=0;i<rows.length;i+=500){const {error}=await sb.from('items').insert(rows.slice(i,i+500)); if(error)throw error}
    await loadAll();
    imp.done=rows.length+' items geïmporteerd: '+S.tx.length+' transacties, '+S.pots.length+' potjes, '+S.balance.length+' balansposten.';
    imp.data=null;

}

function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p}
const kfmt=v=>v>=1000?'€ '+(v/1000).toLocaleString('nl-BE',{maximumFractionDigits:1})+'k':'€ '+Math.round(v);
function barChart(series,labels,colors,highlight){
  const W=640,H=230,L=46,R=8,T=12,B=26; const n=labels.length;
  const max=niceMax(Math.max(1,...series.flat()));
  const sx=(W-L-R)/n, bw=Math.min(14,(sx-8)/series.length);
  let g='';
  for(let i=0;i<=4;i++){const v=max*i/4;const y=T+(H-T-B)*(1-i/4);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+kfmt(v)+'</text>'}
  labels.forEach((lab,i)=>{
    const cx=L+sx*i+sx/2; const tot=series.length*bw+(series.length-1)*3; let x=cx-tot/2;
    series.forEach((s,k)=>{const v=s[i]||0;const h=(H-T-B)*v/max;const y=H-B-h;
      if(v>0)g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" rx="3" style="fill:var('+colors[k]+')"><title>'+esc(lab)+': '+fmt(v)+'</title></rect>';
      x+=bw+3});
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle"'+(i===highlight?' style="fill:var(--fg);font-weight:700"':'')+'>'+lab+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Staafdiagram per maand">'+g+'</svg>';
}
function donut(parts,total,center){
  const r=58,c=2*Math.PI*r; let off=0, g='<circle cx="80" cy="80" r="'+r+'" style="fill:none;stroke:var(--surface-2)" stroke-width="22"/>';
  for(const p of parts){if(p.v<=0)continue;const len=c*p.v/total;
    g+='<circle cx="80" cy="80" r="'+r+'" style="fill:none;stroke:var('+p.color+')" stroke-width="22" stroke-dasharray="'+Math.max(len-2,0.5).toFixed(2)+' '+(c-Math.max(len-2,0.5)).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 80 80)"><title>'+esc(p.label)+': '+fmt(p.v)+'</title></circle>';off+=len}
  g+='<text x="80" y="78" text-anchor="middle" style="fill:var(--fg);font-family:var(--font-display);font-weight:700;font-size:16px">'+esc(center)+'</text><text x="80" y="96" text-anchor="middle" style="fill:var(--muted);font-size:11px">totaal</text>';
  return '<svg class="chart" viewBox="0 0 160 160" role="img" aria-label="Verdeling uitgaven">'+g+'</svg>';

function lineChart(points){
  if(!points.length)return '<div class="empty small">Nog geen metingen. Elke keer dat je de balans aanpast, bewaart de app de stand van die maand.</div>';
  const W=640,H=200,L=56,R=16,T=14,B=26;
  const vals=points.map(p=>p.v); let lo=Math.min(...vals),hi=Math.max(...vals); if(hi===lo){lo=lo*0.9;hi=hi*1.1||100}

  const sx=i=>points.length===1?(L+W-R)/2:L+(W-L-R)*i/(points.length-1);
  const sy=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));

  for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;const y=sy(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+kfmt(v)+'</text>'}

  points.forEach((p,i)=>{const last=i===points.length-1;g+='<circle cx="'+sx(i)+'" cy="'+sy(p.v)+'" r="'+(last?5:3)+'" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"><title>'+esc(p.label)+': '+fmt(p.v)+'</title></circle><text x="'+sx(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.label)+'</text>';

  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ontwikkeling nettovermogen">'+g+'</svg>';

/* ---------- Prognose spaarpotjes (zelfde logica als Excel) ----------
   per maand: totaal = gepland + extra; eerst naar potje 1 tot het doel, dan potje 2, dan potje 3;
   wat overblijft is 'overtollig'. Vertrekt van een vast startpunt, los van de huidige stand. */
const PLAN_ORDER=['safety','onderhoud','fun'];
function getPlan(){const d=S.prognose.find(x=>x.id==='plan');return d?Object.assign({start:{},startLabel:'Startpunt prognose',order:PLAN_ORDER,months:[]},d):null}
const mlabel=k=>k?MSHORT[+k.slice(5,7)-1]+' '+k.slice(0,4):'';
function nextMonthKey(k){let y=+k.slice(0,4),m=+k.slice(5,7)+1;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')}
function forecast(plan){
  plan=plan||getPlan(); if(!plan)return null;
  const order=(plan.order||PLAN_ORDER).filter(id=>S.pots.some(p=>p.id===id));
  const goal=id=>+((S.pots.find(p=>p.id===id)||{}).goal)||0;
  const sal={}; order.forEach(id=>sal[id]=+(plan.start||{})[id]||0);
  let cum=0; const rows=[], full={};
  for(const m of (plan.months||[])){
    const planned=+m.planned||0, extra=+m.extra||0, tot=planned+extra; let rem=tot; const to={};
    for(const id of order){const a=Math.min(rem,Math.max(goal(id)-sal[id],0));to[id]=a;rem-=a;sal[id]+=a}
    cum+=rem;
    rows.push({month:m.month,planned,extra,tot,to,over:rem,sal:Object.assign({},sal),cum});
    for(const id of order){if(!full[id]&&goal(id)>0&&sal[id]>=goal(id))full[id]=m.month}
  }
  return {order,goal,rows,full,cum,start:Object.assign({},plan.start),label:plan.startLabel};
}
async function savePlan(p){
  const data={start:p.start,startLabel:p.startLabel,order:p.order||PLAN_ORDER,months:p.months};
  S.prognose=S.prognose.some(d=>d.id==='plan')?S.prognose.map(d=>d.id==='plan'?Object.assign({id:'plan'},data):d):S.prognose.concat([Object.assign({id:'plan'},data)]);
  return save('prognose','plan',data)}
const PCOLORS={safety:'--c3',onderhoud:'--c5',fun:'--c1'};
const zf=v=>Math.abs(v)<0.005?'<span class="z">–</span>':fmt(v);
function progKpis(fc){const last=fc.rows[fc.rows.length-1];
  return '<div class="kpis">'+fc.order.map(id=>{const f=fc.full[id];return kpi(esc(potName(id))+' vol',f?'25 '+mlabel(f):'Buiten prognose',f?'':'neg','<span class="small muted">doel '+fmt0(fc.goal(id))+'</span>')}).join('')+
    kpi('Extra na alle doelen',fmt0(fc.cum),'','<span class="small" style="opacity:.85">eind prognose'+(last?', '+mlabel(last.month):'')+'</span>',true)+'</div>'}
function progChart(fc){return lineMulti(fc.order.map(id=>({name:potName(id),color:PCOLORS[id]||'--c4',goal:fc.goal(id),vals:[+fc.start[id]||0].concat(fc.rows.map(r=>r.sal[id]))})),['start'].concat(fc.rows.map(r=>mlabel(r.month))))}
function rowCalc(fc,r){return [zf(r.tot)].concat(fc.order.map(id=>zf(r.to[id])),[zf(r.over)],fc.order.map(id=>fmt(r.sal[id])+(fc.full[id]===r.month?'<span class="fulltag">vol</span>':'')),[zf(r.cum)])}
/* Live rekenen: bij elke toets meteen herberekenen, opslaan pas na een korte pauze */
function planFromDom(){const p=getPlan(); if(!p)return null; const months=p.months.map(m=>Object.assign({},m)), start=Object.assign({},p.start); let bad=false;
  document.querySelectorAll('#main [data-pedit]').forEach(el=>{const raw=el.value.trim();const v=raw===''?0:parseAmount(raw);if(!isFinite(v)||v<0){bad=true;return}const i=+el.dataset.i;if(months[i])months[i][el.dataset.pedit]=round2(v)});
  document.querySelectorAll('#main [data-pstart]').forEach(el=>{const raw=el.value.trim();const v=raw===''?0:parseAmount(raw);if(!isFinite(v)||v<0){bad=true;return}start[el.dataset.pstart]=round2(v)});
  return {plan:Object.assign({},p,{months,start}),bad};
}

function lineMulti(series,labels){
  const W=680,H=240,L=52,R=14,T=14,B=26,n=labels.length; if(!n)return '';
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.vals.concat([s.goal||0]))));
  const sx=i=>n===1?(L+W-R)/2:L+(W-L-R)*i/(n-1), sy=v=>T+(H-T-B)*(1-v/max);
  let g='';
  for(let i=0;i<=4;i++){const v=max*i/4,y=sy(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+kfmt(v)+'</text>'}
  for(const s of series){
    if(s.goal)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(s.goal)+'" y2="'+sy(s.goal)+'" style="stroke:var('+s.color+')" stroke-width="1" stroke-dasharray="4 5" opacity=".55"/>';
    const pts=s.vals.map((v,i)=>sx(i).toFixed(1)+','+sy(v).toFixed(1)).join(' ');
    g+='<polyline points="'+pts+'" style="fill:none;stroke:var('+s.color+')" stroke-width="2.5" stroke-linejoin="round"><title>'+esc(s.name)+'</title></polyline>';
    const li=s.vals.length-1; g+='<circle cx="'+sx(li)+'" cy="'+sy(s.vals[li])+'" r="4" style="fill:var('+s.color+');stroke:var(--surface)" stroke-width="2"><title>'+esc(s.name)+': '+fmt(s.vals[li])+'</title></circle>';
  }
  const step=Math.ceil(n/8); labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+='<text x="'+sx(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(l)+'</text>'});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Prognose saldo per potje">'+g+'</svg>';
}
function viewPrognose(){

/* ---------- Jaaroverzicht (zelfde opbouw als Excel) ---------- */
const POT_ROW='Spaarpotjes';
// De regels per blok komen uit de indeling van de groep (grp); extra = regels die de app zelf maakt.
const YEAR_LAYOUT=[
  {id:'in',grp:'inkomen',name:'Inkomsten',extra:[POT_ROW,CARRY_ROW],total:'Totaal inkomsten'},
  {id:'vast',grp:'vast',name:'Uitgaven — vaste lasten',total:'Totaal vaste lasten'},
  {id:'vrij',grp:'vrij',name:'Uitgaven — vrije tijd & dagelijks leven',extra:[POT_ROW],total:'Totaal vrije tijd & dagelijks leven'},
  {id:'spaar',grp:'spaar',name:'Uitgaven — sparen & beleggen',total:'Totaal sparen & beleggen'}
];
// Spaarregels: één regel per potje (stortingen) plus de spaarcategorieën.
const layoutRows=gid=>groupById(gid).layout.map(c=>c?{key:c,label:c===SAVE_CAT?'Overig sparen':c,color:'var(--c3)'}:{key:'',gap:true});
function saveRowDefs(){return S.pots.map(p=>({key:'pot:'+p.id,label:p.name,color:potColor(p)})).concat(layoutRows('spaar'))}
// Op welke spaarregel telt deze transactie? null = geen sparen.
function saveKey(t){
  const potKey=id=>S.pots.some(p=>p.id===id)?'pot:'+id:SAVE_CAT;
  if(moveKind(t)==='storting')return potKey(t.potIn);
  if(t.type!=='uitgave'||!isSaveCat(t.category))return null;
  return t.potIn?potKey(t.potIn):t.category;
}
const rowsOf=s=>(s.grp==='spaar'?saveRowDefs():layoutRows(s.grp)).concat((s.extra||[]).map(r=>({key:r,label:r})));
function yearData(y){
  const inc=Array.from({length:12},()=>({})), exp=Array.from({length:12},()=>({}));
  const potInfo=Array(12).fill(0); // opnames: zichtbaar bij uitgaven Spaarpotjes, maar niet in de totalen
  const known=new Set(GROUPS.filter(g=>g.kind==='uitgave').flatMap(g=>g.cats));
  const add=(o,k,a)=>{o[k]=(o[k]||0)+a};
  for(const t of S.tx){
    if(!t.date||+t.date.slice(0,4)!==y)continue; const m=+t.date.slice(5,7)-1, a=+t.amount||0;
    if(t.type==='inkomen'){add(inc[m],groupOf(t.category).kind==='inkomen'&&CAT_GROUP[t.category]?t.category:'Overige inkomsten',a)}
    else if(moveKind(t)==='opname'){add(inc[m],POT_ROW,a);potInfo[m]+=a}
    else if(saveKey(t))add(exp[m],saveKey(t),a);
    else if(t.type==='uitgave'){
      if(t.potOut){add(exp[m],POT_ROW,a);add(inc[m],POT_ROW,a)}
      else add(exp[m],known.has(t.category)?t.category:'Overig',a);
    }
  }
  for(let m=0;m<12;m++){const c=carryIn(y,m+1);if(c)inc[m][CARRY_ROW]=c}
  return {inc,exp,potInfo};
}

async function layAction(act,el){
  const L=ui.lay, g=el.dataset.g, i=+el.dataset.i, list=L.groups[g]; L.msg='';
  const allNames=()=>Object.values(L.groups).flat().filter(Boolean);
  const askName=(q,def)=>{const n=(prompt(q,def||'')||'').trim(); if(!n)return null;
    if(n!==def&&(allNames().includes(n)||[POT_ROW,CARRY_ROW,'Overig sparen'].includes(n))){L.msg='De naam <b>'+esc(n)+'</b> bestaat al.';return null} return n};
  if(act==='lay-up'&&i>0)[list[i-1],list[i]]=[list[i],list[i-1]];
  if(act==='lay-down'&&i<list.length-1)[list[i+1],list[i]]=[list[i],list[i+1]];
  if(act==='lay-gap')list.push('');
  if(act==='lay-add'){const n=askName('Naam van de nieuwe categorie in '+groupById(g).name+':'); if(n)list.push(n)}
  if(act==='lay-ren'){const old=list[i], n=askName('Nieuwe naam voor "'+old+'":',old);
    if(n&&n!==old){const o=origName(old); list[i]=n; if(n===o)delete L.renames[o]; else L.renames[o]=n}}
  if(act==='lay-del'){const c=list[i];
    if(!c)list.splice(i,1);
    else{const o=origName(c), cnt=S.tx.filter(t=>t.category===o).length;
      if(S.balance.some(b=>b.linkCat===o))L.msg='<b>'+esc(c)+'</b> is gekoppeld aan een post op Balans. Haal eerst die koppeling weg.';
      else if(cnt)L.msg='Er '+(cnt===1?'staat 1 transactie':'staan '+cnt+' transacties')+' in <b>'+esc(c)+'</b>. Zet ze eerst zelf in een andere categorie. <button class="btn small" type="button" data-act="lay-show" data-c="'+esc(o)+'">Toon transacties</button>';
      else if(confirm('Weet je zeker dat je "'+c+'" wilt verwijderen?'))list.splice(i,1)}}
  render();
}
async function saveLayout(){
  const L=ui.lay; let n=0;
  for(const [o,nw] of Object.entries(L.renames)){
    for(const t of S.tx.filter(t=>t.category===o)){if(await save('tx',t.id,{category:nw,updated:Date.now()},true))n++}
    for(const b of S.balance.filter(b=>b.linkCat===o))await save('balance',b.id,{linkCat:nw},true);

}

function kpi(label,val,cls,extra,hero){return '<div class="kpi'+(hero?' hero':'')+'"><span class="label">'+label+'</span><span class="v '+(hero?'':cls)+'">'+val+'</span>'+(extra||'')+'</div>'}

function filteredTx(incomeOnly){
  const f=ui.f; const q=f.q.trim().toLowerCase();
  let L=S.tx.filter(t=>{
    if(incomeOnly&&t.type!=='inkomen')return false;
    if(!incomeOnly&&f.type!=='all'&&t.type!==f.type)return false;
    if(f.year!=='all'&&(t.date||'').slice(0,4)!==f.year)return false;
    if(f.month!=='all'&&+(t.date||'').slice(5,7)!==+f.month)return false;
    if(f.cat!=='all'&&t.category!==f.cat&&!(f.cat===SAVE_CAT&&moveKind(t)==='storting'))return false;
    if(q&&!((t.description||'')+' '+(t.category||'')+' '+(t.note||'')).toLowerCase().includes(q))return false;
    return true});
  const dir=ui.sort.d==='asc'?1:-1;
  L.sort((a,b)=>ui.sort.k==='amount'?((+a.amount||0)-(+b.amount||0))*dir:((a.date||'').localeCompare(b.date||'')||(a.created||0)-(b.created||0))*dir);
  return L;
}

// Kopieert vaste lasten, sparen/beleggen (zonder stortingen naar potjes) en loon van de vorige maand naar de gekozen maand.
let CP=null;
const COPY_VAR=['Boodschappen','Vervoer/brandstof','Onderhoud huis'];
const ymKey=(y,m)=>y+'-'+String(m).padStart(2,'0');
function copyRows(y,m){
  const src=m===1?ymKey(y-1,12):ymKey(y,m-1), dst=ymKey(y,m), last=new Date(y,m,0).getDate();
  // Dubbel = zelfde categorie met dezelfde omschrijving of hetzelfde bedrag. Staat er al iets anders in die categorie,
  // dan komt de regel er zonder vinkje bij, zodat je zelf beslist.
  const inDst=S.tx.filter(t=>(t.date||'').startsWith(dst));
  const key=t=>t.type+'|'+t.category+'|'+(t.description||'').trim().toLowerCase(), keyA=t=>t.type+'|'+t.category+'|'+round2(+t.amount||0);
  const have=new Set(inDst.map(key).concat(inDst.map(keyA))), cats=new Set(inDst.map(t=>t.type+'|'+t.category));
  const rank=c=>{const g=CAT_GROUP[c];return g?GROUPS.indexOf(g)*100+g.cats.indexOf(c):999};
  return S.tx.filter(t=>(t.date||'').startsWith(src)&&((t.type==='inkomen'&&/^Netto loon/.test(t.category))||
      (t.type==='uitgave'&&!t.potOut&&(groupOf(t.category).id==='vast'||(isSaveCat(t.category)&&!t.potIn)))))
    .map(t=>{const loon=t.type==='inkomen', vari=COPY_VAR.includes(t.category), dup=have.has(key(t))||have.has(keyA(t)), maybe=!dup&&cats.has(t.type+'|'+t.category);
      return {t,loon,vari,dup,maybe,on:!dup&&!maybe&&!loon&&!vari,amount:amtStr(t.amount),date:dst+'-'+String(Math.min(+t.date.slice(8,10)||1,last)).padStart(2,'0')}})
    .sort((a,b)=>rank(a.t.category)-rank(b.t.category)||a.t.date.localeCompare(b.t.date));
}

  CP.busy=true; CP.err=''; drawCopy();

function readSheet(){
  if(!F)return; document.querySelectorAll('#txForm [data-f]').forEach(el=>{F.t[el.dataset.f]=el.value});
}
async function submitSheet(){
  readSheet(); const t=F.t; const a=parseAmount(t.amount);
  if(!isFinite(a)||a<=0){F.err='Vul een bedrag groter dan 0 in, bijvoorbeeld 42,50.';drawSheet();return}
  if(!t.date){F.err='Kies een datum.';drawSheet();return}
  if(t.type==='overboeking'&&(!t.potOut||!t.potIn||t.potOut===t.potIn)){F.err='Kies waar het geld vandaan komt en naartoe gaat (twee verschillende plaatsen).';drawSheet();return}
  const rec=F.removeReceipt?null:(F.newReceipt||F.origReceipt);
  const data={date:t.date,type:t.type,amount:round2(a),description:(t.description||'').trim(),note:(t.note||'').trim(),
    category:t.type==='overboeking'?'Overboeking':t.category,
    potIn:t.type==='overboeking'?(t.potIn==='rekening'?'':t.potIn):(t.type==='uitgave'&&isSaveCat(t.category)?(t.potIn||''):''),
    potOut:t.type==='overboeking'?(t.potOut==='rekening'?'':t.potOut):(t.type==='uitgave'&&!isSaveCat(t.category)?(t.potOut||''):''),
    receipt:rec||null, created:t.created||Date.now(), updated:Date.now()};
  if(t.type==='overboeking'){data.from=t.potOut;data.to=t.potIn}
  const id=t.id||newId('tx');
  const ok=await save('tx',id,data);
  if(!ok)return;
  const old=F.origReceipt; if(old&&(!rec||rec.id!==old.id)&&assets)assets.delete(old.id).catch(()=>{});
  const wasNew=F.isNew; F.newReceipt=null; closeSheet(false);
  toast(wasNew?'Transactie toegevoegd':'Wijziging opgeslagen');
}
async function handleFile(file){
  if(!file||!assets||!F)return; readSheet();
  F.busy=true;F.err='';drawSheet();
  try{
    const res=await assets.upload(file,file.type?undefined:{type:'image/jpeg'});
    if(F.newReceipt)assets.delete(F.newReceipt.id).catch(()=>{});
    F.newReceipt={id:res.id,type:res.contentType,name:file.name||'Bonnetje'};F.removeReceipt=false;
  }catch(e){const c=e&&e.code;F.err=c==='too_large'?'Dit bestand is te groot (max. 20 MB).':c==='unsupported_type'?'Dit bestandstype wordt niet ondersteund. Gebruik een foto (JPG, PNG, WEBP) of PDF.':c==='quota_or_state'?'De opslag voor bonnetjes zit vol.':'Uploaden mislukt. Probeer het opnieuw.'}
  F.busy=false;drawSheet();
}
async function showReceipt(r){
  if(!r)return;
  if(r.legacy||!isStoredReceipt(r)){toast('Dit bonnetje staat nog in de oude app. Voeg het opnieuw toe bij de transactie.');return}
  const u=await receiptUrl(r); if(!u){toast('Bonnetje openen mislukt.');return}
  const v=document.createElement('div');v.className='viewer';v.setAttribute('role','dialog');v.setAttribute('aria-label','Bonnetje');
  v.innerHTML=(r.type==='application/pdf'?'<a class="btn primary" href="'+u+'" target="_blank" rel="noopener">PDF openen</a>':'<img src="'+u+'" alt="Bonnetje">')+'<button class="btn" type="button">Sluiten</button>';
  v.addEventListener('click',e=>{if(e.target===v||e.target.tagName==='BUTTON')v.remove()});
  document.body.appendChild(v);
}

    case 'add': openSheet(null,el.dataset.preset?{type:el.dataset.preset,category:'Netto loon 1'}:null); break;

/* ---------- Thema ---------- */
function themePref(){return lsGet('bf-theme')||'dark'}
function applyTheme(){const p=themePref(); if(p==='system'){if(document.documentElement.dataset.bfTheme)document.documentElement.removeAttribute('data-theme');delete document.documentElement.dataset.bfTheme} else {document.documentElement.setAttribute('data-theme',p);document.documentElement.dataset.bfTheme=p}}
function cycleTheme(){const o=['system','light','dark'];const p=o[(o.indexOf(themePref())+1)%3];lsSet('bf-theme',p);applyTheme();renderTheme();toast('Thema: '+({system:'zoals je toestel',light:'licht',dark:'donker'})[p])}
function renderTheme(){const b=document.getElementById('themeBtn');if(b)b.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Thema: '+({system:'automatisch',light:'licht',dark:'donker'})[themePref()]}

/* ---------- Bedragen verbergen ---------- */
// Elk bedrag (€ …) en percentage op het scherm krijgt een wazige laag. Stand per toestel in localStorage.
const PV_RE=/[-−]?€\s?[-−]?\d[\d.]*(?:,\d+)?k?|\d[\d.]*(?:,\d+)?\s?%/g;
const EYE='<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
const pvOn=()=>document.documentElement.classList.contains('pv');
function pvIcon(n){return '<svg width="'+n+'" height="'+n+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">'+EYE+(pvOn()?'<path d="M3 3l18 18"/>':'')+'</svg>'}
function pvMini(){const l=pvOn()?'Bedragen tonen':'Bedragen verbergen';return '<button class="pvmini" type="button" data-act="pv" aria-label="'+l+'" title="'+l+'">'+pvIcon(18)+'</button>'}
function renderPv(){const b=document.getElementById('pvBtn');if(b)b.innerHTML=pvIcon(18)+(pvOn()?'Bedragen tonen':'Bedragen verbergen')}
function pvMark(root){
  if(!pvOn()||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), list=[];
  for(let n=w.nextNode();n;n=w.nextNode()){const p=n.parentNode; if(!p||!p.closest||p.closest('.pvb,.pvt,script,style,textarea'))continue; PV_RE.lastIndex=0; if(PV_RE.test(n.data))list.push(n)}
  for(const n of list){
    const p=n.parentNode;
    if(p.tagName==='OPTION'){p.textContent=p.textContent.replace(PV_RE,'•••');continue}
    if(p.namespaceURI==='http://www.w3.org/2000/svg'){if(p.tagName==='title')p.textContent=p.textContent.replace(PV_RE,'•••');else p.classList.add('pvt');continue}
    const frag=document.createDocumentFragment(); let last=0;
    n.data.replace(PV_RE,(m,i)=>{if(i>last)frag.append(n.data.slice(last,i));const s=document.createElement('span');s.className='pvb';s.textContent=m;frag.append(s);last=i+m.length;return m});
    if(last<n.data.length)frag.append(n.data.slice(last));
    p.replaceChild(frag,n);
  }
}
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===1)pvMark(n);else if(n.nodeType===3)pvMark(n.parentNode)}}).observe(document.body,{childList:true,subtree:true});
function togglePv(){
  const on=!pvOn(); document.documentElement.classList.toggle('pv',on); lsSet('bf-pv',on?'1':'');
  render(); renderPv(); if(on)pvMark(document.body);
  toast(on?'Bedragen verborgen':'Bedragen zichtbaar');
}
if(lsGet('bf-pv')==='1')document.documentElement.classList.add('pv');
renderPv();

/* ---------- Routering ---------- */
const VIEWS=['dashboard','transacties','inkomsten','jaar','potjes','prognose','balans','import','abonnementen'];
function route(){const h=(location.hash||'').slice(1);ui.view=VIEWS.includes(h)?h:'dashboard';ui.confirm=null;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
let wasWide=isWide();window.addEventListener('resize',()=>{const w=isWide();if(w!==wasWide){wasWide=w;render()}});
applyTheme(); route();
sb.auth.onAuthStateChange((ev,sess)=>{
  const was=session&&session.user.id; session=sess;
  if(sess){ authState='in'; if(was!==sess.user.id){for(const c of COLS){S[c]=[];S.loaded[c]=false} dbState='wachten'; render(); setTimeout(()=>loadAll(),0)} else render() }
  else { authState='uit'; for(const c of COLS){S[c]=[];S.loaded[c]=false} dbState='wachten'; loginUi.busy=false; render() }
});
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
